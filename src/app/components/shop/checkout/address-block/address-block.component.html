<div class="empty-box" *ngIf="!addresses?.length">
    <h2>{{ 'no_address_found' | translate }}</h2>
</div>
<div class="row g-3">
    <ng-container *ngFor="let address of addresses; let i = index;">
        <div class="col-xxl-6 col-lg-12 col-md-6">
            <label for="adddress-{{type}}-{{i}}">
                <div class="delivery-address-box w-100 h-100 p-3 border rounded shadow-sm bg-white" style="cursor: pointer;">
                    <div class="d-flex align-items-start gap-3">
                        <div class="form-check m-0 mt-1">
                            <input
                                class="form-check-input"
                                type="radio"
                                value="{{address.id}}"
                                name="adddress-{{type}}"
                                id="adddress-{{type}}-{{i}}"
                                [checked]="i === 0"
                                (change)="set($event)"
                                style="width: 1.25rem; height: 1.25rem; cursor: pointer;">
                        </div>
                        <ul class="delivery-address-detail list-unstyled m-0 w-100">
                            <li class="mb-2">
                                <h5 class="fw-bold m-0 text-dark text-capitalize" style="font-size: 1.1rem;">{{ address?.title }}</h5>
                            </li>
                            <li class="mb-3 text-secondary" style="font-size: 0.95rem; line-height: 1.5;">
                                <div class="address-details d-inline">
                                    <span *ngIf="address?.floor_no">Floor No.: {{ address?.floor_no }}, </span>
                                    <span *ngIf="address?.flat_no">Flat No.: {{ address?.flat_no }}, </span>
                                    <span *ngIf="address?.building">Building: {{ address?.building }}, </span>
                                    <span *ngIf="address?.road">Road: {{ address?.road }}, </span>
                                    <span>{{ address?.street }}, {{ address?.city }}, {{ address?.area }}, {{ address?.country_id }}</span>
                                </div>
                            </li>
                            <li *ngIf="address.pincode || address.phone" class="d-flex flex-wrap gap-4 mt-2 pt-2 border-top">
                                <div class="text-secondary" *ngIf="address.pincode" style="font-size: 0.9rem;">
                                    <span class="fw-semibold text-dark">{{ 'pin_code' | translate }}:</span> {{ address?.pincode }}
                                </div>
                                <div class="text-secondary" *ngIf="address.phone" style="font-size: 0.9rem;">
                                    <span class="fw-semibold text-dark">{{ 'phone' | translate }}:</span> +{{ address?.country_code }} {{ address?.phone }}
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </label>
        </div>
    </ng-container>
</div>
